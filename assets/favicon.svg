<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Rishaan turns one">
  <!-- A checkered flag, to match the cover's "Ready, set, ONE!".
       Drawn for 16px first: three big checks rather than a fine grid, and
       navy behind ivory so it holds its shape against a light browser tab
       as well as a dark one. -->
  <rect width="32" height="32" rx="7.5" fill="#1F5581"/>
  <rect x="6.4" y="5.2" width="2.6" height="21.6" rx="1.3" fill="#FBFAF7"/>
  <rect x="8.8" y="6.8" width="17" height="11.2" rx="1.6" fill="#FBFAF7"/>
  <g fill="#1F5581">
    <rect x="8.8" y="6.8" width="5.67" height="5.6"/>
    <rect x="20.13" y="6.8" width="5.67" height="5.6"/>
    <rect x="14.47" y="12.4" width="5.67" height="5.6"/>
  </g>
</svg>
